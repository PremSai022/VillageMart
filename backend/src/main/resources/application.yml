spring:
  application:
    name: villagemart-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/villagemart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:villagemart}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: INFO
    com.villagemart: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] %logger{36} - %msg%n"

villagemart:
  timezone: Asia/Kolkata
  currency: INR
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  owner:
    username: ${OWNER_USERNAME:}
    mobile: ${OWNER_MOBILE:}
    name: ${OWNER_NAME:Owner}
    password: ${OWNER_PASSWORD:}
  business:
    name: ${BUSINESS_NAME:VillageMart}
    address: ${BUSINESS_ADDRESS:}
    mobile: ${BUSINESS_MOBILE:}
  firebase:
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    push-retry-interval-ms: ${PUSH_RETRY_INTERVAL_MS:300000}
    max-push-attempts: 5
