# Local development stack: MySQL 8 + VillageMart backend.
# Usage: cp .env.example .env  (edit values)  &&  docker compose up --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-villagemart}
      MYSQL_USER: ${MYSQL_USER:-villagemart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-villagemart}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-villagemart}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_PORT: "8080"
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  mysql-data:
